name: DocMind AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Code Linter
        run: npm run lint

      - name: Run Test Suite (Ingestion, Hybrid RAG, Security & Multi-Tenancy)
        run: npm test
        env:
          NODE_ENV: test
          AUTH_SECRET: test-jwt-auth-secret-key-32chars-minimum-ci

      - name: Production Application Build
        run: npm run build
        env:
          NODE_ENV: production
